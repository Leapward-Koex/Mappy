name: mappy
description: Open-source phone companion for the Mappy Pebble navigation app.
publish_to: "none"
version: 0.1.0+1

environment:
  sdk: ^3.12.1

dependencies:
  disable_battery_optimization:
    path: third_party/disable_battery_optimization
  flutter:
    sdk: flutter
  google_maps_flutter: ^2.17.1
  package_info_plus: ^8.3.1
  url_launcher: ^6.3.2

dev_dependencies:
  flutter_launcher_icons: ^0.14.4
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter

flutter:
  uses-material-design: true
  assets:
    - icon/icon_1024_1024.png
